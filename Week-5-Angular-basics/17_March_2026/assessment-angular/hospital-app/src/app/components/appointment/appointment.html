<h2>Hospital Appointment Booking</h2>

<form (ngSubmit)="submitForm()">
  <label>Patient Name:</label>
  <input type="text" [(ngModel)]="patientName" name="name" required />

  <br /><br />

  <label>Doctor:</label>
  <select [(ngModel)]="doctor" name="doctor">
    <option *ngFor="let doc of doctors" [value]="doc">
      {{ doc }}
    </option>
  </select>

  <br /><br />

  <label>Date:</label>
  <input type="date" [(ngModel)]="date" [min]="today" name="date" />

  <br /><br />

  <label>Consultation Type:</label>
  <select [(ngModel)]="consultationType" (change)="updateFee()" name="type">
    <option value="Online">Online</option>
    <option value="Offline">Offline</option>
  </select>

  <br /><br />

  <label>Symptoms:</label>
  <br />
  <textarea [(ngModel)]="symptoms" name="symptoms"></textarea>

  <br /><br />

  <button type="submit">Book Appointment</button>
</form>

<hr />

<h3>Appointment Summary</h3>

<p><b>Name:</b> {{ patientName }}</p>
<p><b>Doctor:</b> {{ doctor }}</p>
<p><b>Date:</b> {{ date }}</p>
<p><b>Type:</b> {{ consultationType }}</p>
<p><b>Fee:</b> ₹{{ fee }}</p>
<p><b>Symptoms:</b> {{ symptoms }}</p>

<div *ngIf="submitted">
  <h3 style="color: green">Appointment Confirmed ✅</h3>
</div>
