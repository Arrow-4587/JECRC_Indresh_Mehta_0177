
<h3>Order details (child)</h3>

<div class = "card">
  <p>Order ID: {{ orderData.id }}</p>
  <p>Product: {{ orderData.product }}</p>
  <!-- <p>Price: ₹{{ orderData.price | currency }}</p> -->
  <p>Status: {{ orderData.status }}</p>
</div>

<hr>

<h3> ⚙️Lifecycle Logs (Live UI)</h3>

<div class = "log-box">
    <div *ngFor="let log of logs">
        {{ log }}
    </div>
</div>
