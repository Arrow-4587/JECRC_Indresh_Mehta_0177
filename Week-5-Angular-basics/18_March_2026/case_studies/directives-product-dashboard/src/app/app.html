<h2>Product Dashboard</h2>

<button (click)="showProducts = !showProducts">Toggle Products</button>

<div *ngIf="showProducts">
  <div *ngFor="let p of products" class="card">
    <h3>{{ p.name }}</h3>
    <p [ngClass] = "{
      'high-price': p.price > 30000,
      'low-price': p.price <= 30000
    }">
      Price: ₹{{ p.price }}
    </p>

    <div [ngSwitch] = "p.status">
      <p *ngSwitchCase="'Available'">Status: Available</p>
      <p *ngSwitchCase="'out'">Status: Out of Stock</p>
      <p *ngSwitchCase="'limited'">Status: Limited Availability</p>

      <p *ngSwitchDefault>Unknown</p>
    </div>

    <p [ngStyle] = "{
      color: p.status === 'Available' ? 'green' : 'red',
      'font-weight': p.price > 30000 ? 'bold' : 'normal'
    }">
        status: {{ p.status }}
    </p>
  </div>
