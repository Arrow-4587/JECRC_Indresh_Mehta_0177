<!DOCTYPE html>
<html>
<head>
<title>Passing Students</title>
</head>
<body>

<h2>Students Who Passed</h2>
<p id="result"></p>

<script>
const marks = [35, 67, 48, 90, 55, 30];

const passingMarks = marks.filter(mark => mark > 50);

document.getElementById("result").innerHTML = passingMarks;
</script>

</body>
</html>
