
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Pass123
    ports:
      - "1433:1433"
    volumes:
      - sqlserverdata:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Pass123' -Q 'SELECT 1'"]
      interval: 10s
      retries: 10
      start_period: 30s

  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8088:88"
    depends_on:
      - sqlserver
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=FoodDb;User Id=sa;Password=YourStrong@Pass123;TrustServerCertificate=True
      - ASPNETCORE_URLS=http://+:88
      - ASPNETCORE_ENVIRONMENT=Development
    restart: unless-stopped

volumes:
  sqlserverdata: {}